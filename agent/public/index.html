<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0d0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="claude-remote">
<title>claude-remote</title>
<link rel="manifest" href="/manifest.webmanifest">
<!-- iOS: opaque, square, 180px. iOS renders transparent pixels black and
     applies its own squircle, so this must NOT be the rounded 192 tile. -->
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-apple-180.png">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
<body>
  <!-- The mark, declared once and drawn wherever it is needed via <use>.
       Inline rather than an <img> so it can never be late or flash a broken
       image on a cold start - which is the very thing the splash below
       exists to prevent. The green is hard-coded, never currentColor: this
       mark is always lit, never muted, never grey.
       viewBox: the shapes span 81-431 x 101-415 once the 19-unit stroke
       outset is counted, so this square is that box padded slightly and
       centred on it. Tightening it to the ink bounds would clip the outer
       edge of the stroke. -->
  <svg hidden aria-hidden="true">
    <symbol id="mark" viewBox="79 81 354 354" fill="none" stroke="#7ee787" stroke-width="38" stroke-linecap="butt">
      <rect x="100" y="120" width="150" height="106" rx="10"/>
      <rect x="286" y="290" width="126" height="106" rx="10"/>
      <path d="M 214 226 L 298 290"/>
    </symbol>
  </svg>

  <!-- Visible before any script runs, and deliberately NOT marked hidden:
       installed to the home screen this window has no browser chrome, so a
       blank moment while the app boots reads as a crash. app.js drops it the
       instant a real screen has painted, and again if boot throws. -->
  <div id="splash">
    <svg width="72" height="72" aria-hidden="true"><use href="#mark"/></svg>
    <div class="title">claude‑remote</div>
    <div class="splash-status">STARTING</div>
  </div>

  <div class="app">
    <header class="hdr">
      <div class="hdr-top">
        <button class="home" id="home" type="button" aria-label="All projects">
          <svg class="mark" width="22" height="22" aria-hidden="true"><use href="#mark"/></svg>
          <span class="title">claude‑remote</span>
        </button>
        <div class="ver">v0.1</div>
        <button class="settings-open" id="settings-open" type="button" hidden>SETTINGS</button>
      </div>
      <!-- Ships hidden and is revealed only when the project list itself is
           rendered. This line reports whether the agent answered for that
           list, so on a passcode screen it has nothing true to say - it would
           claim CONNECTING while the truth is "connected, and locked" - and
           it is one more element that could otherwise put state on a locked
           screen. The hidden attribute is what hides it, so the force-hide
           rule at the top of app.css covers it: no author display rule can
           quietly bring it back.
           It carries no hostname. There is exactly one agent and one machine,
           and the app can only have been installed from that machine's
           origin, so the name is a constant rather than state - and on a
           390px screen the full tailnet name pushed this line to three and
           four wrapped rows of chrome above the first project. -->
      <div class="conn" id="conn" hidden>
        <svg class="dot" width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><circle cx="4" cy="4" r="3.5" fill="none" stroke="#3d4a3d" stroke-width="1"/></svg>
        <span class="conn-text">CONNECTING</span>
      </div>
    </header>

    <main id="picker" hidden>
      <!-- The drill-in back bar. Ships hidden; renderBackBar is the only
           thing that ever reveals it, and only by the hidden attribute -
           never removeAttribute('hidden'). Living inside #picker means the
           [hidden] { display: none !important; } rule at the top of app.css
           covers it too: a late render can never paint it on the passcode
           screen. -->
      <button class="backbar" id="backbar" type="button" hidden>
        <span class="backbar-chev" aria-hidden="true">&lt;</span>
        <span class="backbar-main">
          <span class="backbar-name" id="backbar-name"></span>
          <span class="backbar-path" id="backbar-path"></span>
        </span>
      </button>

      <div class="banner" id="banner" role="status" aria-live="polite" hidden></div>

      <div class="newproj-panel" id="newproj-panel" hidden>
        <label for="newproj-name">New project name</label>
        <input id="newproj-name" type="text" maxlength="64" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="e.g. email-lint">
        <div class="newproj-target" id="newproj-target"></div>
        <div class="newproj-error" id="newproj-error" hidden></div>
        <div class="newproj-actions">
          <button type="button" id="newproj-cancel">CANCEL</button>
          <button type="button" id="newproj-create" disabled>CREATE</button>
        </div>
      </div>

      <section class="zone" aria-labelledby="runhdr-label">
        <div class="runhdr">
          <span id="runhdr-label">RUNNING</span>
          <span class="count" id="run-count">0</span>
        </div>
        <div class="tiles" id="tiles"></div>
      </section>

      <section class="zone">
        <div class="allhdr">
          <span>ALL PROJECTS</span>
          <span class="count" id="all-count">0</span>
        </div>
        <div class="rule"></div>
        <div class="list" id="projects"></div>
      </section>

      <button class="newproj" id="newproj" type="button" aria-label="New project">
        <span class="newproj-box">+</span>
      </button>

      <div class="spacer"></div>
      <div class="actions">
        <button class="refresh" id="refresh" type="button">REFRESH</button>
      </div>
      <footer class="footer" id="footer"></footer>
    </main>

    <main id="accept" hidden>
      <div class="accept">
        <div class="accept-head">
          <!-- Chrome, not copy: the words come from copy.js. Stroked in the
               primary text token, NOT the accent and NOT the danger colour -
               design/tokens.md reserves #7ee787 for "active/running" and
               #ff7b72 for "this ends something", and a warning is neither.
               aria-hidden: the heading beside it already says it. -->
          <svg class="accept-warn" width="15" height="15" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="#eafbea" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
            <path d="M8 2 L15 14 H1 Z"/>
            <path d="M8 6.5 V9.5"/>
            <path d="M8 11.8 V11.9"/>
          </svg>
          <div class="accept-title" id="accept-title"></div>
        </div>

        <p class="accept-lede">
          <span id="accept-lede-1"></span>
          <span class="accept-strong" id="accept-lede-2"></span>
        </p>

        <details class="accept-more" id="accept-more">
          <summary class="accept-more-sum" id="accept-more-sum"></summary>
          <div class="accept-sections" id="accept-sections"></div>
        </details>

        <label class="accept-consent" id="accept-consent">
          <input type="checkbox" id="accept-check" disabled>
          <span id="accept-consent-text"></span>
        </label>

        <div class="accept-note" id="accept-note"></div>

        <button class="accept-go" id="accept-go" type="button" disabled></button>
        <div class="accept-msg" id="accept-msg" role="status" aria-live="polite" hidden></div>
      </div>
    </main>

    <main id="gate" hidden>
      <form class="gate" id="gate-form" novalidate>
        <div class="gate-label" id="gate-label">LOCKED</div>
        <div class="gate-title" id="gate-title">Enter passcode</div>
        <div class="gate-sub" id="gate-sub">6 digits. Asked every time the app opens.</div>

        <label class="gate-field" id="field-pin">
          <span class="gate-fieldlabel">PASSCODE</span>
          <input class="pin" id="pin" type="password" inputmode="numeric"
                 pattern="[0-9]*" maxlength="6" autocomplete="off"
                 enterkeyhint="go" aria-label="Passcode">
        </label>

        <label class="gate-field" id="field-confirm" hidden>
          <span class="gate-fieldlabel">CONFIRM</span>
          <input class="pin" id="pin-confirm" type="password" inputmode="numeric"
                 pattern="[0-9]*" maxlength="6" autocomplete="off"
                 enterkeyhint="go" aria-label="Confirm passcode">
        </label>

        <button class="gate-go" id="gate-go" type="submit" disabled>UNLOCK</button>
        <div class="gate-msg" id="gate-msg" role="status" aria-live="polite"></div>
      </form>
    </main>

    <!-- The folder picker. #folders, NOT #picker: #picker is the project list and
         has been since the first build. Ships hidden and app.css gives it a
         display, so the [hidden] force-hide rule at the top of app.css is what
         holds it shut on the passcode screen. -->
    <main id="folders" hidden>
      <div class="share-head">
        <div class="share-label">CHOOSE FOLDERS TO SHARE</div>
        <div class="share-crumb" id="share-crumb"></div>
      </div>

      <button class="backbar" id="share-up" type="button" hidden>
        <span class="backbar-chev" aria-hidden="true">&lt;</span>
        <span class="backbar-main">
          <span class="backbar-name" id="share-up-name"></span>
          <span class="backbar-path" id="share-up-path"></span>
        </span>
      </button>

      <div class="banner" id="share-msg" role="status" aria-live="polite" hidden></div>

      <section class="zone" id="share-picked-zone" hidden>
        <div class="allhdr"><span>SELECTED</span><span class="count" id="share-picked-count">0</span></div>
        <div class="rule"></div>
        <div class="list" id="share-picked"></div>
        <div class="share-note" id="share-hide-note" hidden></div>
      </section>

      <section class="zone">
        <div class="allhdr"><span id="share-list-label">DRIVES</span><span class="count" id="share-list-count">0</span></div>
        <div class="rule"></div>
        <div class="list" id="share-list"></div>
      </section>

      <div class="spacer"></div>
      <div class="share-actions">
        <button class="share-skip" id="share-skip" type="button"></button>
        <button class="share-save" id="share-save" type="button" disabled>SAVE</button>
      </div>
    </main>

    <!-- Settings root (T77). One <main> per screen, listed in SCREEN_MAIN -
         showScreen is the only thing that reveals it. T79-T85 add their own
         group headings and rows beside FOLDERS; this ships with the one
         destination that already exists. -->
    <main id="settings" hidden>
      <div class="set-head"><div class="set-label">SETTINGS</div></div>

      <section class="zone">
        <div class="allhdr"><span>FOLDERS</span></div>
        <div class="rule"></div>
        <div class="list" id="settings-list"></div>
      </section>

      <div class="spacer"></div>
    </main>
  </div>
</body>
</html>
